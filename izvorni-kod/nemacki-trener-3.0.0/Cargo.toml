[package]
name = "nemacki-trener"
version = "3.0.0"
edition = "2021"
description = "Nemački Trener — srpsko-nemački rečnik i vežbe (A1–B2)"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
slint = "1.18"
rusqlite = { version = "0.41", features = ["bundled"] }
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
debug = false
